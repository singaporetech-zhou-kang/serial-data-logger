name: Something went wrong
description: The app didn't do what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for telling us. A few lines are enough. The app fills in the details below when you use its **Send feedback** link.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console lines or screenshot (optional)
      description: Copy lines from the Console tab, or paste a screenshot.
  - type: input
    id: measure
    attributes:
      label: Measuring
      description: Settings › What are you measuring?
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: browser
    attributes:
      label: Browser and system
