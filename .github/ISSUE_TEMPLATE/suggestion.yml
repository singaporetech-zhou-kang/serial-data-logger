name: Suggestion
description: An idea to make the app better for your lab work.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would help, and in which part of the app (Reading, Trend, Analysis, Settings, Console)?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to do?
      description: The lab task behind it, e.g. "make a calibration curve for the DNS assay".
  - type: input
    id: measure
    attributes:
      label: Measuring
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: browser
    attributes:
      label: Browser and system
